apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv-nfs
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: /dataSSD/K8S/nfs-postgres
    server: 192.168.122.1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: app-reservation
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi

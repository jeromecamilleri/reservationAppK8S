global
    log /dev/log local0
    maxconn 2048
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client 60s
    timeout server 60s

frontend reservation_frontend
    bind 192.168.122.1:8080
    default_backend reservation_nodes

backend reservation_nodes
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    server worker1 192.168.122.11:30080 check
    server worker2 192.168.122.12:30080 check
    server worker3 192.168.122.13:30080 check
